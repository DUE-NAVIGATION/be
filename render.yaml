# Render 배포 설정 (Blueprint)
#
#   Render 대시보드 → New → Blueprint → DUE-NAVIGATION/be 선택
#   이 파일을 읽어 서비스를 만든다. 이후 main 에 푸시하면 자동으로 다시 배포된다.
#
# ★ 볼륨이 없다. 이 서버는 상태가 없다 —
#   사용자 입력을 디스크에 쓰지 않고(설계 원칙 2), 시설·제도 데이터는 이미지에 구워
#   읽기 전용으로만 쓴다. 무료 플랜이 잠들었다 깨어나도 잃는 것이 없다.
#
# ★ 무료 플랜은 15분간 요청이 없으면 잠든다. 첫 요청이 30초~1분 걸린다.
#   발표 5분 전에 /healthz 를 한 번 열어 깨울 것 (DEPLOY.md 체크리스트).

services:
  - type: web
    name: due-api
    runtime: docker
    plan: free
    region: singapore          # 한국에서 가장 가까운 Render 리전
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true

    # PORT 는 Render 가 넣어준다. 서버가 PORT 를 읽으므로 따로 두지 않는다
    envVars:
      # API 키 없이도 AI 입력·설명이 미리 뽑아둔 응답으로 동작한다 (DEMO.md)
      - key: DEMO_MODE
        value: "true"

      # 제도 데이터를 읽는 곳. 문제가 생겨도 뜨도록 json 이 기본
      - key: PROGRAM_SOURCE
        value: json

      # ★ Vercel 프로덕션 도메인을 대시보드에서 넣는다. 정확히 일치해야 한다.
      #   예: https://due-navigator.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # 넣지 않아도 된다. 넣을 때는 대시보드에서만 (코드·이 파일에 쓰지 않는다)
      - key: ANTHROPIC_API_KEY
        sync: false

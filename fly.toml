# Fly.io 배포 설정
#
#   fly launch --no-deploy    # 최초 1회. app 이름을 정한다
#   fly deploy
#
# ★ 볼륨이 없다. 이 서버는 상태가 없다 —
#   사용자 입력을 디스크에 쓰지 않고(설계 원칙 2), 제도 DB 는 이미지에 구워
#   읽기 전용으로만 쓴다. 그래서 인스턴스를 아무 때나 죽였다 살려도 된다.

app = "due-api"
primary_region = "nrt"          # 도쿄. 한국에서 가장 가깝다

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

  # 제도 데이터를 읽는 곳. json | sqlite
  # ★ 기본을 json 으로 둔다. DB 파일에 문제가 생겨도 서비스가 뜬다.
  #   DB 로 시연할 때만 sqlite 로 바꾼다
  PROGRAM_SOURCE = "json"
  PROGRAM_DB = "/app/data/due.db"

  # ★ 프론트를 Vercel 에 올린 뒤 실제 도메인으로 반드시 바꿀 것.
  #   여기가 틀리면 브라우저가 전 요청을 CORS 로 막고,
  #   화면에는 "백엔드 없음" 만 뜬다 (원인을 찾기 어렵다)
  CORS_ALLOWED_ORIGINS = "https://due-navigator.vercel.app"

# ANTHROPIC_API_KEY 는 여기에 쓰지 않는다. 시크릿으로 넣는다:
#   fly secrets set ANTHROPIC_API_KEY=sk-...
# 키가 없어도 서버는 뜨고 판정은 정상 동작한다. 대화형 입력만 막힌다.

[http_service]
  internal_port = 8080
  force_https = true

  # 심사 중에 콜드 스타트로 8초를 까먹으면 안 된다.
  # 최소 1대는 항상 띄워 둔다
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 60
    hard_limit = 100

# 제도 데이터를 못 읽으면 프로세스가 죽는다. 그때 재시작이 반복되면
# 헬스체크가 알려준다 — 조용히 "빈 결과" 를 내는 것보다 낫다
[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"            # 제도 수십 건을 메모리에 올릴 뿐이다
